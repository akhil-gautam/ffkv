{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ffkv.name" . }}
  labels:
    {{- include "ffkv.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ffkv.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            {{- toYaml .Values.networkPolicy.clientPodSelector | nindent 12 }}
          {{- with .Values.networkPolicy.clientNamespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      ports:
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 8080}
  egress: []
{{- end }}
