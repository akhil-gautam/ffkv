apiVersion: v1
kind: Service
metadata:
  name: {{ include "ffkv.name" . }}
  labels:
    {{- include "ffkv.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ffkv.labels" . | nindent 4 }}
  ports:
    - name: resp-tls
      port: {{ .Values.service.respPort }}
      targetPort: resp-tls
    - name: management-tls
      port: {{ .Values.service.managementPort }}
      targetPort: management-tls
