apiVersion: v1
kind: Service
metadata:
  name: {{ include "ffkv.name" . }}-headless
  labels:
    {{- include "ffkv.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "ffkv.labels" . | nindent 4 }}
  ports:
    - name: resp-tls
      port: 6379
      targetPort: resp-tls
