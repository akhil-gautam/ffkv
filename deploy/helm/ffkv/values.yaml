image:
  repository: ffkv
  tag: '0.1.0'
  pullPolicy: IfNotPresent
imagePullSecrets: []
# REQUIRED external Secret keys: users.acl, management-tokens.json,
# health-password, tls.crt, tls.key, ca.crt. No Secret is generated by this chart.
# TLS certificate SAN must include localhost for the in-pod probe; include your
# service DNS/client hostnames for external clients. Production uses your PKI.
existingSecret: ''
healthUsername: health
durability: strict
storage: hybrid
shards: 4
maxConnections: 1024
inlineThreshold: 4096
cacheBytes: 67108864
segmentBytes: 67108864
diskBudget: 8589934592
maxRssBytes: 0 # Optional sampled-RSS soft admission limit; not the cgroup memory limit.
persistence:
  size: 20Gi
  storageClass: null
  existingClaim: ''
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: '2'
    memory: 1Gi
service:
  respPort: 6379
  managementPort: 8080
terminationGracePeriodSeconds: 60
nodeSelector: {}
tolerations: []
affinity: {}
networkPolicy:
  enabled: true
  # Same-namespace clients must carry this label. No public Ingress/LoadBalancer.
  clientPodSelector:
    matchLabels:
      ffkv-client: 'true'
  # Set a namespaceSelector to explicitly permit matching other namespaces.
  clientNamespaceSelector: null
