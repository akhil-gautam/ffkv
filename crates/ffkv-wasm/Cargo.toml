[package]
name = "ffkv-wasm"
version = "0.1.0"
edition = "2024"
description = "ffkv's command engine as a WASI reactor module for the browser playground"
publish = false

# The crate root sits beside src/main.rs so the shared server modules resolve
# their `mod` declarations exactly as they do in the server.
[lib]
crate-type = ["cdylib"]
path = "../../src/wasm.rs"

# The server's dependencies that its engine closure uses. jieba-rs is left out:
# Chinese segmentation is unsupported in the playground (see
# src/engine/search/text.rs).
[dependencies]
bytes = "1"
crc32c = "0.6"
rand = "0.9"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
ryu = "1"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
futures-util = "0.3"
libc = "0.2"
regex = "1"
indexmap = "2"
bson = "2"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
rustc_apfloat = "0.2.3"
num-bigint = "0.4"
rust-stemmers = "1"
unicode-normalization = "0.1"
chrono = "0.4"
geo = "0.31"
wkt = "0.14"
rphonetic = "4"
rayon = "1.11"
smallvec = "1.16"
