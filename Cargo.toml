[package]
name = "ffkv"
version = "0.1.0"
edition = "2024"
description = "freaking fast KV — an incremental Redis-compatible datastore"
publish = false
default-run = "ffkv"

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
rand = "0.9"
tokio = { version = "1", features = ["full"] }
mlua = { version = "0.11", features = ["lua51", "vendored", "serialize", "send"] }
ryu = "1"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
axum = { version = "0.8", features = ["ws", "json", "query"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
sysinfo = "0.33"
libc = "0.2"
mime_guess = "2"
hyper-util = { version = "0.1", features = ["tokio"] }
webpki-roots = "1"
percent-encoding = "2"
rustyline = { version = "19", default-features = false, features = ["buffer-redux"] }
rpassword = "7"
regex = "1"
indexmap = "2"
bson = "2"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
rustc_apfloat = "0.2.3"
num-bigint = "0.4"
rust-stemmers = "1"
unicode-normalization = "0.1"
chrono = "0.4"
geo = "0.31"
wkt = "0.14"
jieba-rs = "0.8"
rphonetic = "4"
rayon = "1.11"
libloading = "0.8.9"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[build-dependencies]
cc = "1.2"

[profile.release]
lto = "thin"
codegen-units = 1
