name: Release

# Push an annotated vX.Y.Z tag (Semantic Versioning, https://semver.org/) whose
# version matches Cargo.toml. See the Releases section of the development guide.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Version and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches every version field
        run: python3 scripts/version.py check --tag "$GITHUB_REF_NAME"

      - name: Changelog has release notes
        run: python3 scripts/version.py notes "${GITHUB_REF_NAME#v}" > /dev/null

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Rust tests
        run: cargo test --locked --all-targets

  image:
    name: Image
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/version.py notes "$version" > notes.md
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '\n\n**Image:** `docker pull %s:%s`\n' "$image" "$version" >> notes.md
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "ffkv $version" --notes-file notes.md "${prerelease[@]}"
