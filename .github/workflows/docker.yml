name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - 'apps/console/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build, smoke-test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Smoke-test the native (amd64) image before anything is pushed.
      - name: Build amd64 image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ffkv:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker volume create ffkv-ci
          docker run -d --name ffkv-ci -p 6379:6379 -v ffkv-ci:/var/lib/ffkv ffkv:ci
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' ffkv-ci)
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && { docker logs ffkv-ci; exit 1; }
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' ffkv-ci)" = healthy ] || { docker logs ffkv-ci; exit 1; }
          test "$(docker exec ffkv-ci ffkv-cli PING)" = PONG
          docker exec ffkv-ci ffkv-cli SET ci:key persisted >/dev/null
          # Plaintext and unauthenticated clients are rejected.
          ! printf 'PING\r\n' | timeout 3 nc 127.0.0.1 6379 | grep -q PONG
          # Data and credentials survive a new container on the same volume.
          docker rm -f ffkv-ci
          docker run -d --name ffkv-ci -v ffkv-ci:/var/lib/ffkv ffkv:ci
          for i in $(seq 1 60); do
            docker exec ffkv-ci ffkv-cli PING >/dev/null 2>&1 && break
            sleep 1
          done
          test "$(docker exec ffkv-ci ffkv-cli GET ci:key)" = persisted
          docker rm -f ffkv-ci

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish amd64 + arm64
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
